# dan-sullivan.co.uk — CircleCI 2.1 pipeline
#
# Modernised Sep 2026: replaced the 2018-era custom Docker image (node 7,
# terraform 0.10.6, python2 awscli) with a standard cimg/node + inline
# terraform/awscli install. The repo's Terraform is now 1.x (HCL2).
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.20
    working_directory: ~/repo

jobs:
  build:
    executor: node
    steps:
      - checkout

      # Install build tooling
      - run:
          name: System deps (zip/unzip/curl)
          command: |
            sudo apt-get update
            sudo apt-get install -y zip unzip curl

      # Node deps
      - run: npm install --no-audit --no-fund

      # Build the Lambda + S3 variants of the site
      - run: npx grunt lambda
      - run: npx grunt exec:zip_lambda_dscouk
      - run: npx grunt s3cf

      # Deploy tooling: Terraform 1.x + AWS CLI v2
      - run:
          name: Install terraform + aws cli
          command: |
            curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip"
            sudo unzip -o /tmp/tf.zip -d /usr/local/bin
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install --update

      # Infra: PR preview environments (served at /prN/). Plan-then-apply the saved plan.
      - run:
          name: Infra - PR preview
          command: |
            if [ -n "$CIRCLE_PULL_REQUEST" ]; then
              cd terraform
              terraform init -input=false
              terraform workspace new "pr${CIRCLE_PULL_REQUEST##*/}" 2>/dev/null || \
                terraform workspace select "pr${CIRCLE_PULL_REQUEST##*/}"
              terraform plan -input=false -out=tfplan
              terraform apply -input=false tfplan
            fi

      # Infra: production (master). First real run performs the one-time state
      # v3->v4 + provider-address migration; review it before the first apply.
      - run:
          name: Infra - master
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ]; then
              cd terraform
              terraform init -input=false
              terraform plan -input=false -out=tfplan
              terraform apply -input=false tfplan
            fi

      # Publish the static site to S3 (master -> s3/, PR -> prN/prN/s3/)
      - run:
          name: Publish S3
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ]; then
              DEST="s3"
            elif [ -n "$CIRCLE_PULL_REQUEST" ]; then
              DEST="pr${CIRCLE_PULL_REQUEST##*/}/${CIRCLE_PULL_REQUEST##*/}/s3"
            else
              DEST="$CIRCLE_BRANCH"
            fi
            aws s3 sync --region eu-west-2 ./dist/ "s3://dan-sullivan.co.uk/${DEST}"

      # Invalidate CloudFront on production deploys
      - run:
          name: Invalidate CloudFront (master)
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ]; then
              cd terraform/core
              terraform init -input=false
              DIST_ID=$(terraform output cloudfront_id)
              aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
            fi

workflows:
  build:
    jobs:
      - build